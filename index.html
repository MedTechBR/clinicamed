<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- a barra de status acompanha o tema: fixa em branco, o modo escuro ficava com uma faixa clara -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClínicaMed">
<title>ClínicaMed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<script>
/* tema antes do CSS para não piscar */
(function(){try{var t=localStorage.getItem("cm_tema")||"auto";
if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-tema",t);}catch(e){}
/* trava a rolagem já aqui: o #cmTrava cobre a tela até a conta ser confirmada */
document.documentElement.classList.add("travado");})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- gramática visual do ecossistema: tokens da raiz do site + ícones Tabler (nunca emoji) -->
<link rel="stylesheet" href="/_mttokens.css?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
/* ============================================================
   ClínicaMed — gramática visual MedTech (papel #FAFAF8, Figtree, Tabler, flat),
   com o teal como cor canônica do app. Sem gradiente, sem fundo-grade, sem emoji.
   Os --mt-* vêm de /_mttokens.css; os nomes curtos abaixo são o contrato local.
   ============================================================ */
:root{
  --papel:var(--mt-bg,#FAFAF8); --sup:#FFFFFF; --sup2:var(--mt-surface-2,#F1F1EC);
  --ink:var(--mt-text,#23272E); --ink2:var(--mt-text-dim,#5E646B); --linha:var(--mt-line,#E8E8E2); --linhaF:var(--mt-line-strong,#DDDDD5);
  --brand:#0B6A72; --brandInk:#0B6A72; --brandSup:#E3F1F1; --brandTxt:#FFFFFF;
  --ok:#1D7A46; --okSup:#E6F3EB; --err:#C6453D; --errSup:#FBEAE8;
  --avi:#A3730A; --aviSup:#FBF1DC;
  --r:12px; --sombra:0 1px 2px rgba(35,39,46,.05),0 6px 18px rgba(35,39,46,.05);
  --nav:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --papel:#121417; --sup:#1B1E23; --sup2:#23272E;
  --ink:#E9EBEE; --ink2:#A3A9B2; --linha:#2B3037; --linhaF:#363C44;
  --brand:#4FB8BD; --brandInk:#4FB8BD; --brandSup:#14292B; --brandTxt:#0E1414;
  --ok:#5FCB8E; --okSup:#14291D; --err:#F0837A; --errSup:#301A18;
  --avi:#E0AE5A; --aviSup:#2C2418;
  --sombra:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-tema="escuro"]{
  --papel:#121417; --sup:#1B1E23; --sup2:#23272E;
  --ink:#E9EBEE; --ink2:#A3A9B2; --linha:#2B3037; --linhaF:#363C44;
  --brand:#4FB8BD; --brandInk:#4FB8BD; --brandSup:#14292B; --brandTxt:#0E1414;
  --ok:#5FCB8E; --okSup:#14291D; --err:#F0837A; --errSup:#301A18;
  --avi:#E0AE5A; --aviSup:#2C2418;
  --sombra:0 1px 2px rgba(0,0,0,.4);
}
:root[data-tema="escuro"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--papel);color:var(--ink);
  font:15px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.005em;
  -webkit-text-size-adjust:100%;padding-bottom:calc(64px + var(--nav))}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.012em;line-height:1.25}
h2{font-size:20px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brandInk)}
.ti{font-size:1.15em;line-height:1;vertical-align:-.12em}
.num{font-variant-numeric:tabular-nums}

/* cabeçalho: branco, linha fina, sem ornamento */
header{position:sticky;top:0;z-index:30;background:var(--sup);border-bottom:1px solid var(--linha);
  padding-top:env(safe-area-inset-top)}
.topo{max-width:1040px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.marca{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.marca .tile{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.marca .tile svg{display:block}
.contador{margin-left:auto;display:flex;align-items:center;gap:6px}
.btIco{width:38px;height:38px;border-radius:10px;border:1px solid var(--linha);background:var(--sup);color:var(--ink2);
  display:grid;place-items:center;cursor:pointer;font-size:19px;padding:0}
.btIco:hover{background:var(--sup2);color:var(--ink)}
nav.abas{max-width:1040px;margin:0 auto;padding:0 10px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{white-space:nowrap;background:transparent;border:0;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;
  border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:500;min-height:38px;font-size:14px}
nav.abas button .ti{font-size:18px}
nav.abas button:hover{background:var(--sup2);color:var(--ink)}
nav.abas button[aria-selected="true"]{background:var(--brandSup);color:var(--brandInk);font-weight:600}
/* a regra de display acima vence o [hidden] do navegador — sem isto a aba Turma apareceria para todos */
nav.abas button[hidden]{display:none!important}
@media(min-width:641px){nav.abas button[data-aba="mais"]{display:none!important}}

main{max-width:1040px;margin:0 auto;padding:16px 14px 40px}
section[hidden]{display:none!important}
.cx{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bt{background:var(--brand);color:var(--brandTxt);border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none}
.bt:hover{filter:brightness(.96)}
.bt.sec{background:var(--sup);color:var(--ink);border-color:var(--linhaF)}
.bt.sec:hover{background:var(--sup2);filter:none}
.bt.mini{padding:6px 11px;min-height:34px;font-size:13px}
.bt:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],input[type=search],input[type=email],input:not([type]),textarea{background:var(--sup);border:1px solid var(--linhaF);border-radius:10px;padding:9px 11px;min-height:42px;max-width:100%;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,106,114,.18)}
textarea{min-height:120px;line-height:1.5}
label.cmp{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:500}
.pilula{display:inline-flex;align-items:center;gap:4px;background:var(--sup2);border:1px solid transparent;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink2);font-weight:500}
.pilula.b{background:var(--brandSup);color:var(--brandInk)}
.pilula.ok{background:var(--okSup);color:var(--ok)}
.pilula.er{background:var(--errSup);color:var(--err)}
.enun{font-size:16.5px;line-height:1.6;margin:12px 0 14px}
.alt{display:flex;gap:11px;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linhaF);
  border-radius:10px;padding:13px;margin-bottom:8px;cursor:pointer;align-items:flex-start;min-height:44px}
.alt:hover{border-color:var(--brand)}
.alt .let{font-weight:700;color:var(--ink2);min-width:18px}
.alt.certa{background:var(--okSup);border-color:var(--ok)}
.alt.errada{background:var(--errSup);border-color:var(--err)}
.alt[disabled]{cursor:default}
.coment{background:var(--sup2);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:13px;margin-top:12px;font-size:14.5px}
.coment .base{font-size:12.5px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px solid var(--linha)}
.expl{font-size:13.5px;color:var(--ink2);margin:6px 0 0 29px}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--sup2);border-radius:10px;padding:13px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink2)}
.barra{height:6px;background:var(--sup2);border-radius:99px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--brand)}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha)}
th{font-size:12px;color:var(--ink2);text-transform:none;font-weight:600}
.faixas{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 0px);z-index:60;padding:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.faixa{pointer-events:auto;max-width:640px;margin:0 auto;width:100%;display:flex;gap:10px;align-items:center;
  border-radius:10px;padding:11px 13px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.18);background:var(--sup)}
.faixa span{flex:1}
.faixa button{background:transparent;border:0;cursor:pointer;font-size:16px;padding:4px 8px;min-height:36px;color:inherit}
.faixa.ok{color:var(--ok);border:1px solid var(--ok)}
.faixa.erro{color:var(--err);border:1px solid var(--err)}
.faixa.avi{color:var(--avi);border:1px solid var(--avi)}
.vazio{color:var(--ink2);font-size:14px;padding:22px 0;text-align:center}
.crono{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
details{border:1px solid var(--linha);border-radius:10px;padding:11px 13px;margin-bottom:8px;background:var(--sup)}
summary{cursor:pointer;font-weight:600}
.quadro{width:100%;border:1px solid var(--linha);border-radius:var(--r);background:var(--sup)}
body.lendo{padding-bottom:0}
body.lendo main{padding-bottom:0}
hr{border:0;border-top:1px solid var(--linha);margin:14px 0}
.mini{font-size:12.5px;color:var(--ink2)}
/* modal */
.fundo{position:fixed;inset:0;background:rgba(20,22,26,.5);z-index:80;display:flex;align-items:flex-start;
  justify-content:center;padding:18px;overflow-y:auto}
.modal{background:var(--sup);border:1px solid var(--linha);border-radius:14px;max-width:620px;width:100%;
  padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);margin:auto}
.modal h3{margin:0 0 4px}
.modal label.cmp{margin-top:12px}
.modal textarea{width:100%}
.opcs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opcs label{display:flex;gap:9px;align-items:flex-start;background:var(--sup2);border:1px solid var(--linha);
  border-radius:9px;padding:10px;cursor:pointer;font-size:14px}
.opcs input{margin-top:2px}
.bt.mini{color:var(--brandTxt)}
.bt.sec.mini{color:var(--ink)}

/* busca global */
.busca{max-width:680px}
.busca .campo{display:flex;gap:8px;align-items:center}
.busca .campo input{flex:1;font-size:16px}
.hit{display:block;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hit:hover{border-color:var(--brand);background:var(--brandSup)}
.hit small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.hit mark{background:var(--aviSup);color:inherit;border-radius:3px;padding:0 2px}
.grupoB{font-size:12px;color:var(--ink2);font-weight:600;margin:14px 0 2px;text-transform:none}

/* convite de instalação e barra do download offline */
.convite{display:flex;gap:12px;align-items:center;background:var(--brandSup);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.convite .ti{font-size:26px;color:var(--brandInk);flex:0 0 auto}
.convite div{flex:1;min-width:0}
.convite b{display:block;font-size:14.5px}
.convite span{font-size:12.5px;color:var(--ink2)}
.convite button{flex:0 0 auto}
@media(max-width:520px){.convite{flex-wrap:wrap}.convite button{width:100%}}
.progOff{height:6px;background:var(--sup2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progOff i{display:block;height:100%;background:var(--brand);transition:width .2s}

/* progresso de leitura no cartão */
.progL{height:4px;background:var(--sup2);border-radius:99px;overflow:hidden;margin-top:10px}
.progL i{display:block;height:100%;background:var(--brand)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- computador: duas colunas onde há filtro + conteúdo ---------- */
@media(min-width:900px){
  #sec-questoes,#sec-leituras,#sec-pratica{display:grid;grid-template-columns:272px minmax(0,1fr);gap:18px;align-items:start}
  #sec-questoes>.cx:first-child,#sec-leituras>.filtroL,#sec-pratica>.cx:first-child{position:sticky;top:104px}
  #sec-questoes>.cx:first-child .linha,#sec-pratica>.cx:first-child .linha{flex-direction:column;align-items:stretch}
  #sec-questoes>.cx:first-child label.cmp,#sec-pratica>.cx:first-child label.cmp{width:100%}
  #sec-questoes>.cx:first-child select,#sec-pratica>.cx:first-child select{width:100%}
  #sec-questoes>.cx:first-child .bt{align-self:stretch!important}
  #sec-leituras>.filtroL .linha{flex-direction:column;align-items:stretch}
  #sec-leituras>.filtroL label.cmp{width:100%;min-width:0!important}
  #sec-leituras .listaL{min-width:0}
  #sec-pratica>.cx:first-child .grade2{grid-template-columns:1fr}
  #sec-pratica .listaP{min-width:0}
  .grade2{grid-template-columns:repeat(4,1fr)}
  .enun{font-size:17.5px}
  .fToggle{display:none}
}
/* cabeçalho de filtro recolhível: no computador fica sempre aberto (regra acima esconde o botão) */
.fToggle{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:4px 0;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.fToggle .ti{font-size:18px;color:var(--ink2)}
.fToggle .resumo{color:var(--ink2);font-weight:500;margin-left:auto;font-size:13px}
.fToggle .seta{transition:transform .15s}
.filtros.aberto .fToggle .seta{transform:rotate(180deg)}

/* ---------- modo app no celular ---------- */
@media(max-width:640px){
  :root{--nav:calc(58px + env(safe-area-inset-bottom))}
  body{font-size:16px}
  .topo{padding:6px 12px 6px 14px;gap:8px}
  .marca{font-size:17px}
  .marca .tile{width:28px;height:28px;border-radius:8px}
  .btIco{width:34px;height:34px;border:0;background:transparent;font-size:21px}
  #btTema{display:none}
  .btConta{height:34px;padding:0 6px;background:transparent;border:0}
  .btConta.logado{background:transparent;color:var(--brandInk)}
  main{padding:10px 16px calc(24px + var(--nav))}
  /* sem caixa para tudo: seções são blocos separados por espaço, não por borda */
  .cx{background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;margin:0 0 22px}
  .cx+.cx{padding-top:18px;border-top:1px solid var(--linha)}
  h2{font-size:22px}
  /* barra inferior com 5 lugares: 4 abas principais + Mais */
  nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:55;margin:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--linha);
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible}
  :root[data-tema="escuro"] nav.abas{background:rgba(27,30,35,.96)}
  @media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) nav.abas{background:rgba(27,30,35,.96)}}
  nav.abas button{display:none;flex-direction:column;gap:2px;padding:4px 2px;min-height:50px;font-size:10.5px;border-radius:10px;justify-content:center;font-weight:500}
  nav.abas button[data-prim],nav.abas button[data-aba="mais"]{display:inline-flex}
  nav.abas button[hidden]{display:none!important}
  nav.abas button .ti{font-size:22px}
  nav.abas button[aria-selected="true"]{background:transparent;color:var(--brandInk);font-weight:600}
  body.lendo nav.abas{display:none}
  body.lendo main{padding:6px 10px 0}
  input,select,textarea{font-size:16px}
  /* filtros recolhidos: um toque abre */
  .filtros .fCorpo{display:none;margin-top:10px}
  .filtros.aberto .fCorpo{display:flex}
  .linha label.cmp{flex:1 1 calc(50% - 5px);min-width:0}
  .linha label.cmp select,.linha label.cmp input{width:100%}
  /* questão: página inteira, alternativas em linhas */
  .enun{font-size:18px;line-height:1.5;margin:10px 0 14px}
  .alt{border:0;border-bottom:1px solid var(--linha);border-radius:0;padding:14px 0;margin:0;gap:14px;background:transparent}
  .alt:last-child{border-bottom:0}
  .alt.certa,.alt.errada{border-radius:10px;padding:14px 12px;border-bottom:0}
  .alt .let{min-width:22px}
  .expl{margin-left:36px}
  #qCartao .linha:last-child .bt{flex:1 1 40%}
  #qCartao .linha:last-child .mini{flex-basis:100%;text-align:center;margin:6px 0 0}
  /* painel: indicadores dois a dois */
  .grade2{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:11px 12px}
  .kpi b{font-size:22px}
  /* leituras: linhas, não cartões */
  .listaL .cx{padding:14px 0;margin:0;border-top:1px solid var(--linha)}
  .listaL .cx:first-child{border-top:0}
  .listaL .cx h3{font-size:16.5px;margin:6px 0 3px}
  .listaL .cx .mini{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .listaL h3.grupo{margin:22px 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
  .listaL h3.grupo .mini{display:none}
  /* cartões: o cartão é a tela */
  #sec-cartoes .heroCard{min-height:calc(100vh - 150px - var(--nav));display:flex;flex-direction:column}
  #sec-cartoes .heroCard .enun{font-size:21px;flex:1;display:flex;align-items:center;margin:20px 0}
  #sec-cartoes .heroCard .bt{width:100%}
  #sec-cartoes .heroCard .linha .bt{flex:1}
  /* estações e simulado */
  .crono{font-size:26px}
  /* painel: a coluna de cobertura (barra) não cabe; a tabela já rola, mas sem ela não precisa */
  #sec-painel table td:nth-child(5),#sec-painel table th:nth-child(5){display:none}
  /* faixas acima da barra */
  .faixas{bottom:calc(var(--nav) + 4px)}
  .fundo{padding:10px;align-items:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:88vh;overflow:auto}
}
/* folha "Mais" da barra inferior */
.folha{position:fixed;inset:0;z-index:70;background:rgba(20,22,26,.35);display:flex;align-items:flex-end}
.folha .cartao{background:var(--sup);width:100%;border-radius:16px 16px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.folha .puxador{width:38px;height:4px;border-radius:4px;background:var(--linhaF);margin:2px auto 10px}
.folha button.item{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;padding:13px 8px;font-size:16px;color:var(--ink);cursor:pointer;border-radius:10px;text-align:left}
.folha button.item .ti{font-size:22px;color:var(--brandInk)}
.folha button.item:hover{background:var(--sup2)}
.folha button.item[aria-selected="true"]{background:var(--brandSup)}
</style>

<header>
 <div class="topo">
  <a class="marca" href="./">
   <span class="tile"><svg width="22" height="14" viewBox="0 0 52 24" fill="none" aria-hidden="true">
    <path d="M1 16h9l3-9 4 15 4-20 4 14 3-6h5l3 6h11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
   </svg></span>
   ClínicaMed

<script>
"use strict";
const V="1.0.0", PREF="cm_";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataISO=(d=new Date())=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const LETRAS="ABCDE";
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- chave estável por conteúdo (djb2+FNV com Math.imul) ----------
   NUNCA indexar progresso por posição no banco: reordenar a leva desalinharia todo o histórico. */
function hashTxt(s){let h1=5381,h2=0x811c9dc5;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=((h1<<5)+h1+c)>>>0;h2=Math.imul(h2^c,0x01000193)>>>0}
  return (h1.toString(36)+h2.toString(36)).slice(0,10)}
function chaveTxt(t){return hashTxt(String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""))}
const chaveQ=q=>chaveTxt(q.q);

const BANCO=window.BANCO||[], TAX=window.TAXONOMIA||[], CEN=window.CENARIOS||[], COMP=window.COMPETENCIAS||[],
      NIVEIS=window.NIVEIS||[], PROVAS=window.PROVAS||[], FLASH=window.FLASH||[], PRATICA=window.PRATICA||[],
      LEITURAS=window.LEITURAS||[];
const QIDX=new Map();
BANCO.forEach(q=>{const ch=chaveQ(q); if(QIDX.has(ch))console.warn("COLISÃO de chave:",ch,q.q.slice(0,60)); QIDX.set(ch,q); q._ch=ch});
const NOME=Object.fromEntries(TAX.map(t=>[t.id,t.nome]));
const NCEN=Object.fromEntries(CEN.map(t=>[t.id,t.nome]));
const NCOMP=Object.fromEntries(COMP.map(t=>[t.id,t.nome]));
const NNIV=Object.fromEntries(NIVEIS.map(t=>[t.id,t.nome]));

const UI={banner(tipo,msg,fixa){
  const d=document.createElement("div");d.className="faixa "+tipo;
  d.innerHTML=`<span>${esc(msg)}</span><button aria-label="fechar"><i class="ti ti-x" aria-hidden="true"></i></button>`;
  d.querySelector("button").onclick=()=>d.remove();
  $("#faixas").appendChild(d); if(!fixa)setTimeout(()=>d.remove(),11000);
}};

/* ---------- blindagem de armazenamento ----------
   load() que falha TRAVA a gravação da chave: melhor não salvar do que salvar vazio por cima. */
const CHAVES=["resp","fav","flash","erros","cfg","sim","simativo","pos","treino","atividade","lidas","contest","prog"].map(k=>PREF+k);
const LIVROS="cm-livros-v1";   /* balde do service worker que guarda leituras e figuras */
const ARM={
 db:null,travas:{},tsBackup:0,recuperado:null,persistOK:null,
 async boot(){
  this.db=await Promise.race([new Promise(r=>setTimeout(()=>r(null),2500)),new Promise(res=>{
    try{const rq=indexedDB.open("cm-db",1);
      rq.onupgradeneeded=()=>{const d=rq.result;
        if(!d.objectStoreNames.contains("espelho"))d.createObjectStore("espelho");
        if(!d.objectStoreNames.contains("backups"))d.createObjectStore("backups",{autoIncrement:true})};
      rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
    }catch(e){res(null)}})]);
  let canario=null; try{canario=localStorage.getItem(PREF+"canary")}catch(e){}
  if(!canario&&this.db){
    const esp=await this.idbTudo("espelho");
    const ks=Object.keys(esp).filter(k=>CHAVES.includes(k));
    if(ks.length){ks.forEach(k=>{try{localStorage.setItem(k,esp[k])}catch(e){}});
      this.recuperado={n:ks.length,quando:esp.__quando||"data desconhecida"}}
  }
  try{localStorage.setItem(PREF+"canary",new Date().toISOString())}catch(e){}
  this.idbPut("__quando",new Date().toISOString());
  if(navigator.storage&&navigator.storage.persist){try{this.persistOK=await navigator.storage.persist()}catch(e){this.persistOK=false}}
 },
 idbPut(k,v){if(!this.db)return;try{this.db.transaction("espelho","readwrite").objectStore("espelho").put(v,k)}catch(e){}},
 idbTudo(loja){return new Promise(res=>{if(!this.db)return res({});
   try{const out={},cur=this.db.transaction(loja,"readonly").objectStore(loja).openCursor();
     cur.onsuccess=()=>{const c=cur.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};
     cur.onerror=()=>res({})}catch(e){res({})}})},
 load(k,fb){let raw=null,falhou=false;
   try{raw=localStorage.getItem(k)}catch(e){falhou=true;this.travas[k]="leitura falhou: "+e.message}
   if(raw===null&&!falhou)return fb;
   if(!falhou){try{return JSON.parse(raw)}catch(e){this.travas[k]="JSON corrompido"}}
   UI.banner("erro",`Falha ao ler ${k}. Gravação BLOQUEADA nessa chave para não apagar dados — exporte o backup em Ajustes.`,true);
   return fb},
 save(k,v){
   if(this.travas[k]){UI.banner("erro",`Não gravei ${k}: a leitura falhou neste boot (proteção contra sobrescrita).`);return false}
   let s;try{s=JSON.stringify(v)}catch(e){return false}
   try{localStorage.setItem(k,s)}catch(e){UI.banner("erro","Armazenamento cheio ou indisponível: "+e.message,true);return false}
   this.idbPut(k,s);
   const ag=Date.now(); if(ag-this.tsBackup>6e5){this.tsBackup=ag;this.snapshot("auto")}
   return true},
 snapshot(motivo){return new Promise(res=>{if(!this.db)return res(false);
   const foto={__quando:new Date().toISOString(),__motivo:motivo||"manual"};
   CHAVES.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)foto[k]=v}catch(e){}});
   try{const tx=this.db.transaction("backups","readwrite"),st=tx.objectStore("backups");
     st.add(foto);const rq=st.getAllKeys();
     rq.onsuccess=()=>{const ks=rq.result;
       if(ks.length>12){const tx2=this.db.transaction("backups","readwrite");
         ks.slice(0,ks.length-12).forEach(k=>tx2.objectStore("backups").delete(k))}
       res(true)};
     rq.onerror=()=>res(false)}catch(e){res(false)}})},
 listaBackups(){return new Promise(res=>{if(!this.db)return res([]);
   try{const out=[],cur=this.db.transaction("backups","readonly").objectStore("backups").openCursor();
     cur.onsuccess=()=>{const c=cur.result;
       if(c){out.push({id:c.key,quando:c.value.__quando,motivo:c.value.__motivo,
         n:Object.keys(c.value).filter(k=>k.startsWith(PREF)).length});c.continue()}
       else res(out.reverse())};
     cur.onerror=()=>res([])}catch(e){res([])}})},
 restaura(id){return new Promise(res=>{if(!this.db)return res(false);
   try{const rq=this.db.transaction("backups","readonly").objectStore("backups").get(id);
     rq.onsuccess=async()=>{const foto=rq.result;if(!foto)return res(false);
       await this.snapshot("antes-de-restaurar");
       Object.keys(foto).filter(k=>k.startsWith(PREF)).forEach(k=>{try{localStorage.setItem(k,foto[k])}catch(e){}});
       res(true)};
     rq.onerror=()=>res(false)}catch(e){res(false)}})},
 exporta(){const out={__app:"clinicamed",__v:V,__quando:new Date().toISOString()};
   CHAVES.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)out[k]=v}catch(e){}});return out},
 async importa(o){if(!o||o.__app!=="clinicamed")return null;
   await this.snapshot("antes-de-importar");let n=0;
   CHAVES.forEach(k=>{if(typeof o[k]==="string"){try{JSON.parse(o[k])}catch(e){return}
     try{localStorage.setItem(k,o[k]);this.idbPut(k,o[k]);n++}catch(e){}}});
   return n}
};

let ST={};
function carregaEstado(){ST={
  resp:ARM.load(PREF+"resp",{}), fav:ARM.load(PREF+"fav",{}), flash:ARM.load(PREF+"flash",{}),
  erros:ARM.load(PREF+"erros",[]), cfg:ARM.load(PREF+"cfg",{}), sim:ARM.load(PREF+"sim",[]),
  simativo:ARM.load(PREF+"simativo",null), pos:ARM.load(PREF+"pos",{}), treino:ARM.load(PREF+"treino",{}),
  atividade:ARM.load(PREF+"atividade",{}), lidas:ARM.load(PREF+"lidas",{}), contest:ARM.load(PREF+"contest",[]),
  prog:ARM.load(PREF+"prog",{})
}}
/* Único funil de gravação do app — por isso o carimbo da nuvem nasce aqui, e não espalhado
   por cada ponto de escrita. NUVEM.carimba compara com o retrato anterior e datas o que mudou. */
function salva(k,v){const ok=ARM.save(PREF+k,v);
  if(ok&&typeof NUVEM!=="undefined"){NUVEM.carimba(k,v);NUVEM.agenda()}
  return ok}
/* redesenha a aba aberta — usado quando a nuvem traz novidade do outro aparelho */
function repinta(){const a=(ST.cfg||{}).aba;if(PINTA[a])PINTA[a]()}
function atividade(n){const d=dataISO();ST.atividade[d]=(ST.atividade[d]||0)+n;salva("atividade",ST.atividade)}
function registraResposta(q,alt,ok,modo){
  const r=ST.resp[q._ch]||(ST.resp[q._ch]={hist:[]});
  r.hist.push({d:dataISO(),ok,alt,m:modo,ts:Date.now()});
  if(r.hist.length>60)r.hist=r.hist.slice(-60);
  salva("resp",ST.resp);atividade(1);
  if(!ok){ if(!ST.erros.includes(q._ch)){ST.erros.push(q._ch);salva("erros",ST.erros)} }
  else { const i=ST.erros.indexOf(q._ch); if(i>=0&&acertosSeguidos(q)>=2){ST.erros.splice(i,1);salva("erros",ST.erros)} }
}
const respostaDe=q=>ST.resp[q._ch];
function acertosSeguidos(q){const h=(respostaDe(q)||{}).hist||[];let n=0;
  for(let i=h.length-1;i>=0;i--){if(h[i].ok)n++;else break}return n}

/* ---------- sorteio: Fisher-Yates de verdade ----------
   sort(()=>Math.random()-0.5) NÃO embaralha: o comparador é inconsistente e enviesa o começo do vetor. */
function embaralha(a){const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
/* espalha por tema: a leva é temática, então a ordem crua sai agrupada. Sorteio PONDERADO pelo
   que resta (o determinístico degenera em pingue-pongue entre os dois maiores temas). */
function espalhaTemas(lista){
  const grupos={};lista.forEach(q=>{(grupos[q.tema]=grupos[q.tema]||[]).push(q)});
  Object.keys(grupos).forEach(k=>grupos[k]=embaralha(grupos[k]));
  const out=[];let ant=null;
  while(out.length<lista.length){
    let cand=Object.keys(grupos).filter(k=>grupos[k].length&&k!==ant);
    if(!cand.length)cand=Object.keys(grupos).filter(k=>grupos[k].length);
    const total=cand.reduce((s,k)=>s+grupos[k].length,0);
    let r=Math.random()*total,esc=cand[0];
    for(const k of cand){r-=grupos[k].length;if(r<=0){esc=k;break}}
    out.push(grupos[esc].shift());ant=esc;
  }
  return out;
}

<script>
/* ================= navegação ================= */
const ABAS=[["questoes","Questões","list-check"],["simulado","Simulado","stopwatch"],["pratica","Prática","stethoscope"],
            ["leituras","Leituras","book"],["cartoes","Cartões","cards"],["painel","Painel","chart-bar"],

/* A aba Turma nasce escondida e só é revelada quando o backend confirma que este e-mail
   é da coordenação. Esconder o botão é conveniência: a permissão é conferida na função,

/* no celular só estas quatro ficam na barra; o resto entra pela folha "Mais" */

/* Resolvido na hora da chamada: cada aba é declarada num bloco <script> posterior a este,

const PINTA={questoes:()=>pintaQuestoes(),simulado:()=>pintaSimulado(),pratica:()=>pintaPratica(),
             leituras:()=>pintaLeituras(),cartoes:()=>pintaCartoes(),
             painel:()=>pintaPainel(),turma:()=>TURMA.chefe?TURMA.carrega():TURMA.pintaTurma(),ajustes:()=>pintaAjustes()};
/* a barra inferior do celular é uma grade: precisa saber quantas abas estão visíveis */
function ajustaNav(){const n=$$("#abas button").filter(b=>!b.hidden).length;
  document.documentElement.style.setProperty("--nAbas",n)}
function abreMais(){
  if($("#folhaMais"))return;
  const d=document.createElement("div");d.className="folha";d.id="folhaMais";
  const itens=ABAS.filter(([id])=>!ABAS_PRIM.includes(id)&&!$(`#abas [data-aba="${id}"]`).hidden);

  $$("#folhaMais [data-vai]").forEach(b=>b.onclick=()=>{d.remove();irAba(b.dataset.vai)});
}
/* caixa de filtros que recolhe no celular (no computador o botão some e ela fica aberta) */
function filtroBox(k,resumo,corpo,extra){
  const ab=!!(ST.cfg.fAb||{})[k];
  return `<div class="cx filtros${ab?" aberto":""}" data-fk="${k}">

    <div class="linha fCorpo">${corpo}</div>${extra||""}</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".fToggle"); if(!b)return;

  ST.cfg.fAb=ST.cfg.fAb||{}; ST.cfg.fAb[k]=!ST.cfg.fAb[k]; salva("cfg",ST.cfg);

});
function montaAbas(){
  $("#abas").innerHTML=ABAS.map(([id,n,ic])=>
    `<button role="tab" data-aba="${id}" aria-selected="false"${ABAS_RESTRITAS.includes(id)?" hidden":""}${ABAS_PRIM.includes(id)?" data-prim":""}><i class="ti ti-${ic}" aria-hidden="true"></i><span>${n}</span></button>`).join("")

/* ================= convite de instalação =================
   Sem isto, instalar dependia de o usuário achar "adicionar à tela inicial" no menu do navegador.
   O convite só aparece quando o navegador diz que dá (beforeinstallprompt) e o usuário não
   dispensou antes; no iPhone, onde esse evento não existe, mostra a instrução do Safari. */
let promptInstalar=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptInstalar=e;convidaInstalar()});
addEventListener("appinstalled",()=>{promptInstalar=null;const c=$("#convite");if(c)c.remove()});
function jaEhApp(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function convidaInstalar(){
  if(jaEhApp()||ST.cfg.semConvite||$("#convite"))return;
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(!promptInstalar&&!iOS)return;
  const sec=$("#sec-"+((ST.cfg||{}).aba||"questoes")); if(!sec)return;
  const d=document.createElement("div"); d.className="convite"; d.id="convite";
  d.innerHTML=`<i class="ti ti-device-mobile" aria-hidden="true"></i>
    <div><b>Instale o ClínicaMed no aparelho</b><span>${iOS
      ? "No Safari: botão de compartilhar e depois “Adicionar à Tela de Início”."
      : "Abre em tela cheia, entra pelo ícone e funciona sem internet."}</span></div>
    ${promptInstalar?`<button class="bt mini" id="btInstalar">Instalar</button>`:""}
    <button class="btIco" id="btNaoInstalar" aria-label="dispensar"><i class="ti ti-x"></i></button>`;
  sec.prepend(d);
  if($("#btInstalar"))$("#btInstalar").onclick=async()=>{
    const p=promptInstalar; promptInstalar=null; d.remove();
    p.prompt(); await p.userChoice;
  };
  $("#btNaoInstalar").onclick=()=>{ST.cfg.semConvite=1;salva("cfg",ST.cfg);d.remove()};
}

/* ================= modo offline =================
   O ativo do app são 97 leituras e 41 figuras — 44 h de estudo. O service worker guarda o que
   você abre, mas quem vai estudar no plantão precisa poder baixar tudo ANTES. O download é
   explícito por causa da rede do hospital: ninguém deve gastar 2,6 MB de 4G sem ter pedido.
   A página fala direto com a Cache API (mesmo balde que o SW lê), sem depender de mensagem. */
const OFF={
  urls(){
    const v=(document.querySelector('script[src*="leituras.js"]').src.match(/v=(\d+)/)||[])[1]||"";
    const u=LEITURAS.filter(l=>l.f).map(l=>"leituras/"+l.f);
    u.push("leituras/_leitura.css?v="+v,"leituras/_leitura.js?v="+v);
    (typeof FIGS!=="undefined"?FIGS:[]).forEach(f=>u.push("leituras/fig/"+f+".svg"));
    /* as radiografias são raster e vivem em outra pasta — sem esta linha a biblioteca offline
       baixaria os esquemas e deixaria as fotos de fora, que é o pior dos dois mundos. */
    (typeof FOTOS!=="undefined"?FOTOS:[]).forEach(f=>u.push("leituras/fig/foto/"+f+".webp"));
    return u;
  },
  async estado(){
    try{
      const c=await caches.open(LIVROS), ks=await c.keys();
      /* comparar pela URL ABSOLUTA resolvida: recortar o prefixo "/clinicamed/" à mão dava
         0 de 140 em qualquer caminho diferente (localhost, subpasta, domínio próprio). */
      const tem=new Set(ks.map(r=>r.url));
      const alvo=this.urls();
      const faltam=alvo.filter(u=>!tem.has(new URL(u,location.href).href));
      return {total:alvo.length, baixados:alvo.length-faltam.length, faltam};
    }catch(e){ return {total:0,baixados:0,faltam:[],erro:e.message} }
  },
  async baixa(aoAndar){
    const c=await caches.open(LIVROS);
    const {faltam}=await this.estado();
    let n=0;
    for(let i=0;i<faltam.length;i+=6){
      await Promise.all(faltam.slice(i,i+6).map(async u=>{
        try{ const r=await fetch(u,{cache:"reload"}); if(r.ok)await c.put(u,r) }catch(e){}
        n++; if(aoAndar)aoAndar(n,faltam.length);
      }));
    }

};
/* ================= busca global =================
   Procura em títulos e seções das leituras (indice-leituras.js), enunciados das questões,
   cartões e estações. A seção da leitura abre já rolada até o cabeçalho (#id). */
function normaliza(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function marca(txt,q){const n=normaliza(txt),i=n.indexOf(q);if(i<0)return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length))}
function buscaTudo(q){
  q=normaliza(q).trim(); if(q.length<2)return null;
  const out={leituras:[],secoes:[],questoes:[],cartoes:[],estacoes:[]};
  const idx=(typeof IDXL!=="undefined")?IDXL:[];
  LEITURAS.filter(l=>l.f).forEach(l=>{
    if(normaliza(l.t+" "+l.s+" "+(l.tipo||"")).includes(q))out.leituras.push(l);
    const ix=idx.find(x=>x.f===l.f); if(!ix)return;
    ix.h.forEach(h=>{if(normaliza(h.t).includes(q))out.secoes.push({l,h})});
  });
  BANCO.forEach(x=>{if(out.questoes.length<40&&normaliza(x.q).includes(q))out.questoes.push(x)});
  FLASH.forEach((c,i)=>{if(out.cartoes.length<20&&normaliza((c.f||c.frente||"")+" "+(c.v||c.verso||"")).includes(q))out.cartoes.push({c,i})});
  PRATICA.forEach(e=>{if(normaliza((e.t||e.titulo||"")+" "+(e.caso||"")).includes(q))out.estacoes.push(e)});
  return out;
}

function filtroAtual(){const f=ST.pos.fq||{};return {area:f.area||"",cen:f.cen||"",comp:f.comp||"",niv:f.niv||"",modo:f.modo||"todas",proc:f.proc||""}}
function aplicaFiltro(){
  const f=filtroAtual();
  let l=BANCO.filter(q=>(!f.area||q.tema===f.area)&&(!f.cen||q.cenario===f.cen)&&(!f.comp||q.comp===f.comp)&&(!f.niv||q.nivel===f.niv));
  if(f.modo==="erros")l=l.filter(q=>ST.erros.includes(q._ch));
  if(f.modo==="fav")l=l.filter(q=>ST.fav[q._ch]);
  if(f.modo==="novas")l=l.filter(q=>!respostaDe(q));
  /* procedência: `fonte` só existe na questão copiada de prova real (banca+ano) */
  if(f.proc==="real")l=l.filter(q=>q.fonte);
  if(f.proc==="autoral")l=l.filter(q=>!q.fonte);
  return l;
}
const assinaturaFiltro=()=>JSON.stringify(filtroAtual());
function ordemQuestoes(){
  const lista=aplicaFiltro(), ass=assinaturaFiltro();
  if(ST.pos.assq!==ass||!Array.isArray(ST.pos.ordq)||!ST.pos.ordq.length){
    ST.pos.ordq=espalhaTemas(lista).map(q=>q._ch);ST.pos.assq=ass;ST.pos.chq=ST.pos.ordq[0]||null;
    salva("pos",ST.pos);
  }
  const setch=new Set(lista.map(q=>q._ch));
  let ord=ST.pos.ordq.filter(ch=>setch.has(ch));
  /* Questão cuja chave não está na ordem salva entra no FIM, espalhada por tema — é o caso de
     leva nova publicada e de enunciado corrigido (a chave deriva do texto). Sem isso ela ficaria
     invisível; e se TODAS as chaves mudarem, a aba ficaria vazia para sempre com o filtro intacto. */
  if(ord.length<lista.length){
    const jaTem=new Set(ord);
    ord=ord.concat(espalhaTemas(lista.filter(q=>!jaTem.has(q._ch))).map(q=>q._ch));
    ST.pos.ordq=ord;salva("pos",ST.pos);
  }
  return ord.map(ch=>QIDX.get(ch)).filter(Boolean);
}

 {id:"enare",nome:"Acesso R+",     n:80,  min:240, det:"80 questões em 4 horas, 1,25 ponto cada — formato das provas de pré-requisito."},
 {id:"livre",nome:"Treino curto",  n:30,  min:60,  det:"30 questões em 1 hora, para uma sessão de estudo do dia a dia."}
];
const formatoSimulado=()=>FORMATOS.find(f=>f.id===(ST.cfg.formato||"livre"))||FORMATOS[2];
function sorteiaProva(n){
  /* sorteio PONDERADO pelo peso da área na prova: reproduz a matriz de especialidades do edital */
  const porArea={};TAX.forEach(t=>porArea[t.id]=embaralha(BANCO.filter(q=>q.tema===t.id)));
  const out=[];const pesos=TAX.map(t=>({id:t.id,p:t.peso}));
  let guarda=0;
  while(out.length<n&&guarda++<n*40){
    const disp=pesos.filter(x=>porArea[x.id].length);
    if(!disp.length)break;
    const tot=disp.reduce((s,x)=>s+x.p,0);let r=Math.random()*tot,esc=disp[0];
    for(const x of disp){r-=x.p;if(r<=0){esc=x;break}}
    out.push(porArea[esc.id].shift());
  }
  return espalhaTemas(out);
}

    ${FORMATOS.map(f=>`<button class="bt ${f.id===fmt.id?"":"sec"} mini" data-fmt="${f.id}">${esc(f.nome)}</button>`).join("")}

    <label class="cmp">Questões<input type="number" id="simN" value="${Math.min(fmt.n,BANCO.length)}" min="5" max="${BANCO.length}" style="width:110px"></label>
    <label class="cmp">Minutos<input type="number" id="simM" value="${fmt.min}" min="5" max="360" style="width:110px"></label>

   ${hist.map(h=>`<tr><td>${esc(h.quando.slice(0,10))}</td><td>${h.n}</td><td>${h.acertos}</td>

  $$("[data-fmt]").forEach(b=>b.onclick=()=>{ST.cfg.formato=b.dataset.fmt;salva("cfg",ST.cfg);pintaSimulado()});
  $("#btIniciar").onclick=()=>{
    const n=Math.max(5,Math.min(+$("#simN").value||fmt.n,BANCO.length)), min=Math.max(5,+$("#simM").value||fmt.min);
    const qs=sorteiaProva(n);
    if(qs.length<5)return UI.banner("avi","Banco pequeno demais para um simulado. Adicione questões primeiro.");
    ST.simativo={ini:Date.now(),dur:min*60,qs:qs.map(q=>q._ch),res:{},i:0,prova:fmt.id};
    salva("simativo",ST.simativo);pintaSimulado();
  };
}

  const q=QIDX.get(s.qs[s.i]);

     `<button class="alt${s.res[q._ch]===j?" certa":""}" data-j="${j}"><span class="let">${LETRAS[j]}</span><span>${esc(a)}</span></button>`).join("")}</div>

  });
  $("#sAnt").onclick=()=>{s.i--;salva("simativo",s);clearInterval(iv);pintaSimulado()};
  $("#sProx").onclick=()=>{s.i++;salva("simativo",s);clearInterval(iv);pintaSimulado()};
  $("#sPular").onclick=()=>{if(s.i<s.qs.length-1)s.i++;salva("simativo",s);clearInterval(iv);pintaSimulado()};
  $("#btEncerrar").onclick=()=>{clearInterval(iv);encerraSim(false)};

function notaSimulado(s,acertos){
  /* TECM: as 100 primeiras valem 0,8 e as 20 últimas valem 1,0 (item 9.6 do edital).
     Quando o banco não permite 120 questões, a nota é proporcional ao mesmo total de 100 pontos. */
  if(s.prova==="tecm"){
    let pts=0;s.qs.forEach((ch,k)=>{const q=QIDX.get(ch);if(s.res[ch]===q.gab)pts+=(k<100?0.8:1.0)});
    const teto=s.qs.reduce((t,_,k)=>t+(k<100?0.8:1.0),0);
    return teto?pts/teto*100:0;
  }
  if(s.prova==="enare")return acertos*1.25*(80/Math.max(1,s.qs.length));
  return acertos/Math.max(1,s.qs.length)*100;
}
function encerraSim(porTempo){
  const s=ST.simativo;if(!s)return;
  let acertos=0;
  s.qs.forEach(ch=>{const q=QIDX.get(ch);const r=s.res[ch];
    if(r!==undefined){const ok=r===q.gab;if(ok)acertos++;registraResposta(q,r,ok,"simulado")}});
  s.fim=Date.now();s.acertos=acertos;s.nota=notaSimulado(s,acertos);
  ST.sim.push({quando:new Date().toISOString(),n:s.qs.length,acertos,nota:s.nota,
    dur:Math.floor((s.fim-s.ini)/1000),prova:s.prova,qs:s.qs,res:s.res});
  salva("sim",ST.sim);salva("simativo",s);
  if(porTempo)UI.banner("avi","O tempo acabou. A prova foi corrigida com o que estava marcado.");
  pintaSimulado();
}

    <div class="kpi"><b>${s.acertos}/${s.qs.length}</b><span>acertos</span></div>
    <div class="kpi"><b>${pct(s.acertos,s.qs.length)}%</b><span>aproveitamento</span></div>
    <div class="kpi"><b>${Math.round((s.fim-s.ini)/60000)}</b><span>minutos usados</span></div>
   </div>
   <p class="mini" style="margin-top:12px">${nota>=corte?"Acima da nota de corte desta prova.":"Abaixo da nota de corte desta prova."}
    ${s.prova==="tecm"?"No TECM as 100 primeiras questões valem 0,8 e as 20 últimas valem 1,0; a análise curricular soma até 10 pontos, e as duas fases não se compensam.":""}</p>
   <div class="linha" style="margin-top:12px">
    <button class="bt" id="btRevisar">Revisar questão a questão</button>
    <button class="bt sec" id="btNovo">Novo simulado</button>
   </div>
  </div>
  <div class="cx"><h3 style="margin:0 0 8px">Por área</h3><div class="rolagem"><table>
   <tr><th>Área</th><th>Acertos</th><th>%</th></tr>
   ${Object.entries(porArea).sort((a,b)=>pct(a[1].ok,a[1].n)-pct(b[1].ok,b[1].n)).map(([id,a])=>
     `<tr><td>${esc(NOME[id]||id)}</td><td>${a.ok}/${a.n}</td>
      <td><span class="pilula ${pct(a.ok,a.n)>=70?"ok":"er"}">${pct(a.ok,a.n)}%</span></td></tr>`).join("")}
  </table></div></div>
  <div id="revisao"></div>`;
  $("#btNovo").onclick=()=>{ST.simativo=null;salva("simativo",null);pintaSimulado()};
  $("#btRevisar").onclick=()=>{
    $("#revisao").innerHTML=s.qs.map((ch,k)=>{const q=QIDX.get(ch),r=s.res[ch],ok=r===q.gab;
      return `<div class="cx"><div class="linha" style="gap:6px">
        <span class="pilula ${ok?"ok":"er"}">${k+1}. ${ok?"acertou":r===undefined?"em branco":"errou"}</span>
        <span class="pilula b">${esc(NOME[q.tema]||q.tema)}</span></div>
       <p class="enun">${esc(q.q)}</p>
       ${q.alts.map((a,j)=>`<div class="alt${j===q.gab?" certa":(j===r?" errada":"")}">
         <span class="let">${LETRAS[j]}</span><span>${esc(a)}</span></div>`).join("")}
       <div class="coment">${esc(q.coment)}<div class="base">Âncora: ${esc(q.base)}</div></div></div>`}).join("");
    $("#btRevisar").disabled=true;
  };
}

  const vis=todas.filter(casa);
  const minVis=vis.reduce((s,l)=>s+(l.min||0),0);

  const filtrando=!!(fl.area||termo||fl.so);
  // com filtro ativo, some com os separadores de secao e mostra lista corrida

let progDeb;
addEventListener("message",e=>{
  const m=e.data; if(!m||m.cm!=="prog"||!m.f)return;
  const pct=Math.max(0,Math.min(100,Math.round(+m.pct||0)));

  ST.prog[m.f]=pct;
  clearTimeout(progDeb); progDeb=setTimeout(()=>salva("prog",ST.prog),1500);
  if(pct>=95&&!ST.lidas[m.f]){ST.lidas[m.f]=true;salva("lidas",ST.lidas);atividade(2);

});

function cartaoDe(i){return ST.flash[i]||(ST.flash[i]={n:0,ef:2.5,int:0,prox:dataISO()})}
function devidos(){return FLASH.map((c,i)=>({c,i,e:cartaoDe(i)})).filter(x=>x.e.prox<=dataISO())}
function pintaCartoes(){
  const fc=ST.cfg.fc||"";
  const todosDev=devidos();
  const d=fc?todosDev.filter(x=>x.c.tema===fc):todosDev;
  // o seletor mostra a area e quantos cartoes dela estao vencidos hoje
  const areasCard=TAX.filter(x=>FLASH.some(c=>c.tema===x.id));
  const barra=`
   <div class="linha" style="margin-bottom:10px">

        return `<option value="${x.id}"${x.id===fc?" selected":""}>${esc(x.nome)} — ${n} hoje</option>`}).join("")}
    </select></label>
    ${fc?`<button class="bt sec mini" id="cLimpa" style="align-self:flex-end">limpar</button>`:""}
   </div>`;
  const liga=()=>{
    if($("#cArea"))$("#cArea").onchange=e=>{ST.cfg.fc=e.target.value;salva("cfg",ST.cfg);pintaCartoes()};
    if($("#cLimpa"))$("#cLimpa").onclick=()=>{ST.cfg.fc="";salva("cfg",ST.cfg);pintaCartoes()};
  };
  if(!d.length){
    $("#sec-cartoes").innerHTML=`<div class="cx"><h2 style="margin:0 0 8px">Cartões</h2>${barra}
      <p class="vazio">${fc?"Nenhum cartão desta área vence hoje.":`Nada para revisar hoje. São ${FLASH.length} cartões no total; volte amanhã.`}</p></div>`;
    return liga();
  }
  const {c,i}=d[0];
  $("#sec-cartoes").innerHTML=`
  <div class="cx heroCard">${barra}<div class="linha">
    <span class="pilula b">${esc(NOME[c.tema]||c.tema)}</span>
    <span class="mini" style="margin-left:auto">${d.length} para hoje</span></div>
   <p class="enun">${esc(c.a)}</p>
   <div id="verso"></div>
   <button class="bt" id="btVirar">Mostrar a resposta</button>
  </div>`;
  liga();
  $("#btVirar").onclick=()=>{
    $("#verso").innerHTML=`<div class="coment">${esc(c.b)}</div>`;
    $("#btVirar").outerHTML=`<div class="linha">
      <button class="bt sec" data-q="0">errei</button>
      <button class="bt sec" data-q="3">difícil</button>
      <button class="bt" data-q="5">fácil</button></div>`;
    $$("[data-q]").forEach(b=>b.onclick=()=>{avaliaCartao(i,+b.dataset.q);atividade(1);pintaCartoes()});
  };
}
function avaliaCartao(i,q){
  const e=cartaoDe(i);
  if(q<3){e.n=0;e.int=1}
  else{e.n++;e.int=e.n===1?1:e.n===2?6:Math.round(e.int*e.ef);
       e.ef=Math.max(1.3,e.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)))}
  const d=new Date();d.setDate(d.getDate()+e.int);e.prox=dataISO(d);
  ST.flash[i]=e;salva("flash",ST.flash);
}

function estatArea(){
  return TAX.map(t=>{

    qs.forEach(q=>{const h=(respostaDe(q)||{}).hist||[];if(h.length){n++;if(h[h.length-1].ok)ok++}});
    const taxa=n?ok/n:null, cob=qs.length?n/qs.length:0;
    /* prioridade = peso na prova × (o que você erra) × (o quanto ainda não viu) */
    const prio=t.peso*(1-(taxa===null?0.5:taxa))*(1.3-cob);
    return {t,total:qs.length,n,ok,taxa,cob,prio};
  }).sort((a,b)=>b.prio-a.prio);
}

   ${ST.contest.length?ST.contest.slice(0,15).map((c,i)=>`
     <details style="margin-top:8px"><summary>${esc(c.quando.slice(0,10))} · ${esc(c.tipo)} · ${esc(c.area||"")} — ${esc(c.motivo)}</summary>
      <p class="mini" style="margin:8px 0">${esc(c.texto)}</p>
      <div class="linha"><button class="bt sec mini" data-reenv="${i}">Reabrir e-mail</button>
       <button class="bt sec mini" data-copiar="${i}">Copiar</button></div>
     </details>`).join(""):`<p class="mini">Nenhuma contestação registrada.</p>`}
  </div>
  <div class="cx">
   <h3 style="margin:0 0 8px">Sobre</h3>
   <p class="mini">ClínicaMed ${V} · ${BANCO.length} questões · ${FLASH.length} cartões · ${PRATICA.length} estações · ${LEITURAS.filter(l=>l.f).length} leituras.
   Conteúdo autoral ancorado em diretriz com ano declarado. Nenhuma conduta aqui substitui a diretriz na fonte: em prova e em plantão, confira a versão vigente.</p>
  </div>`;
  $$("[data-tema]").forEach(b=>b.onclick=()=>{ST.cfg.tema=b.dataset.tema;salva("cfg",ST.cfg);aplicaTema();pintaAjustes()});
  pintaOffline();
  if($("#btEntrar"))$("#btEntrar").onclick=()=>NUVEM.entrar();
  if($("#btSair"))$("#btSair").onclick=()=>{
    if(confirm("Sair da conta? O ClínicaMed pede login, então a tela de entrada volta. O progresso já sincronizado continua na nuvem."))NUVEM.sair()};
  $("#btExp").onclick=()=>{
    const blob=new Blob([JSON.stringify(ARM.exporta())],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`clinicamed-backup-${dataISO()}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  $("#btImp").onclick=()=>$("#arqImp").click();
  $("#arqImp").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const n=await ARM.importa(JSON.parse(await f.text()));
      if(n===null)return UI.banner("erro","Esse arquivo não é um backup do ClínicaMed.");
      carregaEstado();UI.banner("ok",`${n} chaves restauradas.`);pintaAjustes();
    }catch(err){UI.banner("erro","Não consegui ler o arquivo: "+err.message)}
  };
  $("#btSnap").onclick=async()=>{await ARM.snapshot("manual");UI.banner("ok","Ponto de restauração criado.");pintaAjustes()};
  const bks=await ARM.listaBackups();
  $("#listaBk").innerHTML=bks.length?`<div class="rolagem"><table>
    <tr><th>Quando</th><th>Origem</th><th>Chaves</th><th></th></tr>
    ${bks.map(b=>`<tr><td>${esc(b.quando.replace("T"," ").slice(0,16))}</td><td>${esc(b.motivo)}</td><td>${b.n}</td>
      <td><button class="bt sec mini" data-bk="${b.id}">restaurar</button></td></tr>`).join("")}</table></div>`
    :`<p class="mini">Nenhum ponto de restauração ainda.</p>`;
  $$("[data-reenv]").forEach(b=>b.onclick=()=>{const c=ST.contest[+b.dataset.reenv];
    location.href=`mailto:${EMAIL_MEDTECH}?subject=${encodeURIComponent(c.assunto)}&body=${encodeURIComponent(c.corpo)}`});
  $$("[data-copiar]").forEach(b=>b.onclick=async()=>{const c=ST.contest[+b.dataset.copiar];
    try{await navigator.clipboard.writeText(`Para: ${EMAIL_MEDTECH}\nAssunto: ${c.assunto}\n\n${c.corpo}`);
      UI.banner("ok","Copiado.")}catch(e){UI.banner("avi","Não consegui copiar neste navegador.")}});
  $$("[data-bk]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Restaurar este ponto? O estado atual é salvo antes, como ponto de restauração."))return;
    const ok=await ARM.restaura(+b.dataset.bk);
    if(ok){carregaEstado();UI.banner("ok","Backup restaurado.");pintaAjustes()}else UI.banner("erro","Não consegui restaurar.");
  });
}

/* ================= boot ================= */
(async function(){
  carregaEstado();
  await ARM.boot();
  carregaEstado();
  NUVEM.init();   /* retrato do estado antes da primeira gravação (carimbos da nuvem) */
  if(ARM.recuperado)UI.banner("ok",`Recuperei ${ARM.recuperado.n} chaves do espelho interno (backup de ${String(ARM.recuperado.quando).slice(0,10)}). Seus dados voltaram.`,true);
  aplicaTema();
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if((ST.cfg.tema||"auto")==="auto")aplicaTema()});
  montaAbas();
  /* deep-link das leituras: ../index.html?area=<tema>#questoes aplica o filtro e limpa a URL.
     O parâmetro é `area` e não `tema` para não colidir com o ?tema= do claro/escuro. */
  const par=new URLSearchParams(location.search), areaLink=par.get("area");
  if(areaLink&&TAX.some(t=>t.id===areaLink)){
    ST.pos.fq={area:areaLink,cen:"",comp:"",niv:"",modo:"todas"};
    ST.pos.assq=null;ST.pos.chq=null;salva("pos",ST.pos);ST.cfg.aba="questoes";ST.cfg.lendo=null;salva("cfg",ST.cfg);
    history.replaceState(null,"",location.pathname);
  }
  irAba(ST.cfg.aba&&PINTA[ST.cfg.aba]?ST.cfg.aba:"questoes");
  convidaInstalar();
  /* atalho do toque longo no ícone (manifest shortcuts): ?ir=<aba> */
  const irPar=par.get("ir");
  if(irPar&&PINTA[irPar]){ST.cfg.aba=irPar;salva("cfg",ST.cfg);history.replaceState(null,"",location.pathname)}
  NUVEM.boot();   /* não bloqueia: o app já está de pé; a nuvem entra quando responder */
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  window.__cm={ST,ARM,BANCO,QIDX,chaveQ,embaralha,espalhaTemas,irAba,estatArea,V};
})();
</script>
