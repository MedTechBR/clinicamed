<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="Curva pressão-volume com pontos de inflexão inferior e superior"><style>text{font-family:Figtree,system-ui,sans-serif} .t{font-size:13px;font-weight:600;fill:#23272E}.l{font-size:11px;fill:#5E646B} .k{font-size:11px;font-weight:600;fill:#0B6A72}</style><rect width="560" height="330" fill="#FFFFFF"/><text class="t" x="16" y="24">Curva pressão-volume: onde a PEEP e o platô precisam ficar</text><g fill="none" stroke="#DDDDD5" stroke-width="1"><path d="M70 60H520"/><path d="M70 96H520"/><path d="M70 132H520"/><path d="M70 168H520"/><path d="M70 204H520"/><path d="M70 240H520"/><path d="M70 60V240"/><path d="M145 60V240"/><path d="M220 60V240"/><path d="M295 60V240"/><path d="M370 60V240"/><path d="M445 60V240"/><path d="M520 60V240"/></g><path d="M70 240 C 150 236, 190 200, 235 150 C 280 100, 340 78, 430 70 C 470 67, 500 66, 520 66" fill="none" stroke="#0B6A72" stroke-width="2.6"/><path d="M235 150 L235 240" stroke="#C6453D" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M430 70 L430 240" stroke="#C6453D" stroke-width="1.4" stroke-dasharray="4 3"/><text class="k" x="196" y="256">ponto de inflexão inferior</text><text class="k" x="392" y="256">ponto de inflexão superior</text><text class="l" x="70" y="276">PEEP abaixo dele: colapso e reabertura a cada ciclo</text><text class="l" x="70" y="292">Pressão de platô acima dele: hiperdistensão do alvéolo aberto</text><text class="l" x="16" y="150" transform="rotate(-90 16 150)">volume</text><text class="l" x="280" y="316">pressão de vias aéreas</text></svg>